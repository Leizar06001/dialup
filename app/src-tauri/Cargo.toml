[package]
name = "v34-app"
description = "Interface rétro du modem V.34 (Tauri v2, Windows / Linux / macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "v34-app"

[[bin]]
name = "v34-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable : plusieurs vues web dans une fenêtre (navigateur) ;
# macos-proxy : proxy par vue web sur macOS (≥ 14)
tauri = { version = "2", features = ["unstable", "macos-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
v34-core = { workspace = true }
v34-net = { workspace = true }
# Pour simuler le FAI en boucle locale (même code que sur le VPS)
v34-server = { path = "../../crates/v34-server" }
cpal = "0.15"

# Linux : les vues web de Tauri sont des widgets WebKitGTK, rangés dans une
# boîte GTK (mise en page du navigateur, caméra du visiophone). Mêmes
# versions que celles qu'apporte déjà Tauri (rien de neuf dans Cargo.lock).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
libc = "0.2"
