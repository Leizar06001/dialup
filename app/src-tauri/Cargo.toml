[package]
name = "v34-app"
description = "Interface rétro du modem V.34 (Tauri v2, Windows / Linux / macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "v34-app"

[[bin]]
name = "v34-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable : plusieurs vues web dans une fenêtre (navigateur) ;
# macos-proxy : proxy par vue web sur macOS (≥ 14)
tauri = { version = "2", features = ["unstable", "macos-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
v34-core = { workspace = true }
v34-net = { workspace = true }
# Pour simuler le FAI en boucle locale (même code que sur le VPS)
v34-server = { path = "../../crates/v34-server" }
cpal = "0.15"
