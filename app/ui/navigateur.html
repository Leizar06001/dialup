<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tinyverse Navigator</title>
  <style>
    /* Esthétique Windows 98 / Netscape 4 */
    :root { --face: #c0c0c0; --hi: #ffffff; --lo: #808080; --dk: #000000; --navy: #000080; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--face); color: #000; overflow: hidden;
      font: 12px Tahoma, Verdana, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
    body { display: flex; flex-direction: column; border-bottom: 2px solid var(--lo); }
    .row { display: flex; align-items: center; gap: 4px; padding: 4px 6px; }
    .bar1 { border-bottom: 1px solid var(--lo); box-shadow: 0 1px 0 var(--hi); }
    button { font: inherit; background: var(--face); color: #000; cursor: pointer;
      border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
      box-shadow: inset -1px -1px 0 var(--lo), inset 1px 1px 0 #dfdfdf; padding: 2px 8px; min-height: 26px; }
    button:active, button.on { border-color: var(--dk) var(--hi) var(--hi) var(--dk);
      box-shadow: inset 1px 1px 0 var(--lo); }
    button.big { display: flex; flex-direction: column; align-items: center; min-width: 64px; padding: 2px 4px; line-height: 1.05; }
    button.big b { font-size: 18px; font-weight: normal; }
    button:disabled { color: var(--lo); text-shadow: 1px 1px 0 var(--hi); cursor: default; }
    .seg { display: flex; margin-left: 10px; }
    .seg button { min-height: 40px; font-weight: bold; }
    .sep { width: 2px; height: 40px; border-left: 1px solid var(--lo); border-right: 1px solid var(--hi); margin: 0 4px; }
    label { margin-right: 2px; }
    input { flex: 1; font: 13px "Courier New", monospace; padding: 3px 4px; background: #fff; color: #000;
      border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); outline: none;
      -webkit-user-select: text; user-select: text; }
    /* Logo animé pendant le chargement : pluie de météores dans un ciel de nuit */
    .throbber { width: 44px; height: 44px; margin-left: auto; display: grid; place-items: center; position: relative;
      overflow: hidden; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
      background: radial-gradient(circle at 50% 130%, #23339a, var(--navy) 55%, #000030);
      color: #fff; font: bold 26px Georgia, serif; }
    .throbber b { position: relative; z-index: 2; transition: text-shadow .4s, color .4s; }
    .throbber.busy b { color: #fff8d0; text-shadow: 0 0 6px #9cf, 0 0 12px #36f; animation: lueur 1.6s ease-in-out infinite alternate; }
    @keyframes lueur { to { text-shadow: 0 0 3px #9cf, 0 0 6px #36f; color: #fff; } }
    .throbber::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .4s;
      background: radial-gradient(1px 1px at 8px 9px, #fff, transparent), radial-gradient(1px 1px at 33px 6px, #cdf, transparent),
        radial-gradient(1px 1px at 24px 30px, #fff, transparent), radial-gradient(1px 1px at 5px 33px, #cdf, transparent),
        radial-gradient(1px 1px at 36px 25px, #fff, transparent); }
    .throbber.busy::before { opacity: 1; animation: scintille 0.9s steps(2) infinite; }
    @keyframes scintille { 50% { opacity: .55; } }
    .throbber i { position: absolute; z-index: 1; width: 18px; height: 1.5px; border-radius: 1px; opacity: 0;
      background: linear-gradient(90deg, #fff, rgba(160, 200, 255, .6) 30%, transparent); }
    .throbber.busy i { animation: meteore 1.3s linear infinite; }
    .throbber i:nth-child(2) { left: 30px; top: -4px; }
    .throbber i:nth-child(3) { left: 44px; top: 6px; animation-delay: .45s !important; }
    .throbber i:nth-child(4) { left: 20px; top: -10px; animation-delay: .85s !important; }
    @keyframes meteore {
      0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
      15%, 65% { opacity: 1; }
      100% { transform: translate(-46px, 33px) rotate(-35deg); opacity: 0; } }
    /* Jauge dans la barre d'adresse */
    @property --p { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
    #addr { --p: 0%; transition: --p .5s ease-out; }
    #addr.charge { background: linear-gradient(90deg, #c4d4ff 0 var(--p), #fff var(--p)); }
    #addr.vague { background: #fff linear-gradient(90deg, transparent, #c4d4ff, transparent) no-repeat;
      background-size: 30% 100%; animation: balaie 1.4s ease-in-out infinite; }
    @keyframes balaie { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    .status { display: flex; align-items: center; gap: 6px; min-width: 260px; justify-content: flex-end;
      padding: 2px 6px; border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); height: 24px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #600; box-shadow: inset 1px 1px 1px #000; }
    .dot.on { background: #0c0; box-shadow: 0 0 4px #0f0; }
    .call { margin-left: 4px; }
  </style>
</head>
<body>
  <div class="row bar1">
    <button class="big" id="b-back" title="Page précédente"><b>◀</b>Précédente</button>
    <button class="big" id="b-fwd" title="Page suivante"><b>▶</b>Suivante</button>
    <button class="big" id="b-reload" title="Actualiser"><b>⟳</b>Actualiser</button>
    <button class="big" id="b-home" title="Accueil"><b>⌂</b>Accueil</button>
    <button class="big" id="b-stop" title="Arrêter le chargement"><b>■</b>Arrêter</button>
    <div class="sep"></div>
    <div class="seg" role="group" aria-label="Mode de navigation">
      <button id="m-1998" class="on" title="Pages allégées par le FAI : texte, liens, images 256 couleurs">WEB 1998</button>
      <button id="m-mod" title="Le vrai web, tel quel… à 33,6 kbit/s">MODERNE</button>
    </div>
    <div class="throbber" id="throbber" title="Tinyverse Navigator"><b>T</b><i></i><i></i><i></i></div>
  </div>
  <form class="row" id="f-go" autocomplete="off">
    <label for="addr">Adresse :</label>
    <input id="addr" spellcheck="false" placeholder="ex. fr.wikipedia.org/wiki/Modem">
    <button type="submit">Aller</button>
    <div class="status" id="status"><i class="dot" id="dot"></i><span id="st-text">Hors ligne</span>
      <button type="button" class="call" id="b-call" title="Composer le numéro du FAI">Appeler le FAI</button></div>
  </form>
  <script src="nav-progres.js"></script>
  <script>
    const T = window.__TAURI__;
    const $ = (id) => document.getElementById(id);
    let mode = localStorage.getItem("nav-mode") || "1998";
    let online = false;
    let last = { t: performance.now(), rx: 0, tx: 0 }, rate = { rx: 0, tx: 0 };

    function setMode(m) {
      mode = m;
      try { localStorage.setItem("nav-mode", m); } catch (_) {}
      $("m-1998").classList.toggle("on", m === "1998");
      $("m-mod").classList.toggle("on", m === "moderne");
    }
    setMode(mode);
    T.core.invoke("nav_initial").then((v) => { if (v) { setMode(v[0]); $("addr").value = v[1]; } });
    const go = (addr) => T.core.invoke("nav_go", { input: addr, mode }).catch((e) => alert(e));
    $("m-1998").onclick = () => { setMode("1998"); go($("addr").value); };
    $("m-mod").onclick = () => { setMode("moderne"); go($("addr").value); };
    $("f-go").onsubmit = (e) => { e.preventDefault(); go($("addr").value); };
    $("b-home").onclick = () => { $("addr").value = ""; go(""); };
    for (const [id, cmd] of [["b-back", "back"], ["b-fwd", "forward"], ["b-reload", "reload"], ["b-stop", "stop"]])
      $(id).onclick = () => T.core.invoke("nav_cmd", { cmd });
    $("b-call").onclick = () => T.core.invoke("at_command", { line: "ATDT0836656565" });

    T.event.listen("nav:url", (e) => {
      const u = e.payload;
      if (u.includes("hors-ligne.html") || u.startsWith("tauri:") || u.startsWith("http://tauri.localhost")) return;
      T.core.invoke("nav_display_url", { url: u }).then((d) => { if (document.activeElement !== $("addr")) $("addr").value = d; });
    });
    // Chargement : météores sur le logo, jauge dans l'adresse, bouton Arrêter
    suivreChargement((e) => {
      $("throbber").classList.toggle("busy", e.occupe);
      $("b-stop").disabled = !e.occupe;
      const addr = $("addr");
      addr.classList.toggle("vague", e.occupe && e.vague);
      addr.classList.toggle("charge", e.occupe && !e.vague);
      addr.style.setProperty("--p", `${Math.round((e.occupe && !e.vague ? e.part || 0 : 0) * 100)}%`);
    });
    T.event.listen("v34:state", (e) => {
      const s = e.payload, st = s.status;
      const wasOnline = online;
      online = !!s.proxy;
      $("dot").classList.toggle("on", online);
      $("b-call").style.display = online || s.call_state !== "idle" ? "none" : "";
      const now = performance.now(), dt = (now - last.t) / 1000;
      if (dt > 0.9) {
        const rx = st.bytes_rx || 0, tx = (st.link && st.link.bytes_acked) || 0;
        rate = { rx: Math.max(0, rx - last.rx) / dt / 1024, tx: Math.max(0, tx - last.tx) / dt / 1024 };
        last = { t: now, rx, tx };
      }
      const r = st.params && st.params.data_rate_rx;
      let txt;
      if (online) txt = `En ligne ${r ? r.toLocaleString("fr-FR") + " bit/s" : ""} · ↓ ${rate.rx.toFixed(1).replace(".", ",")} Ko/s · ↑ ${rate.tx.toFixed(1).replace(".", ",")} Ko/s`;
      else if (s.call_state === "dialing" || s.call_state === "connecting") txt = "Connexion au FAI en cours…";
      else if (s.call_state === "online") txt = "En ligne (chat) — appelez le FAI pour Internet";
      else txt = "Hors ligne";
      $("st-text").textContent = txt;
      if (online && !wasOnline) go($("addr").value);
      if (!online && wasOnline) T.core.invoke("nav_offline");
    });
  </script>
</body>
</html>
