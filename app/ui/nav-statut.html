<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Barre d'état</title>
  <style>
    /* Barre d'état de Netscape 4 : cadenas, jauge, texte */
    :root { --face: #c0c0c0; --hi: #ffffff; --lo: #808080; --dk: #000000; --navy: #000080; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--face); color: #000;
      font: 12px Tahoma, Verdana, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; cursor: default; }
    body { display: flex; align-items: center; gap: 3px; padding: 2px 3px; border-top: 1px solid var(--hi); }
    .cell { height: 20px; display: flex; align-items: center; padding: 0 5px;
      border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); white-space: nowrap; overflow: hidden; }
    .lock { width: 26px; justify-content: center; padding: 0; }
    .lock svg { width: 11px; height: 14px; }
    .lock .shackle { fill: none; stroke: #404040; stroke-width: 1.6; }
    .lock .body { fill: #808080; stroke: #404040; stroke-width: .8; }
    .lock.sure .body { fill: #c8a000; }
    .lock.sure .shackle { stroke: #806000; }
    .meter { width: 160px; padding: 2px; position: relative; }
    /* blocs façon Windows 98 */
    .fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--navy) 0 8px, transparent 8px 10px); }
    .meter.vague .fill { width: 34px; animation: vague 1.4s ease-in-out infinite alternate; }
    @keyframes vague { from { transform: translateX(0); } to { transform: translateX(118px); } }
    .text { flex: 1; min-width: 0; text-overflow: ellipsis; display: block; line-height: 18px; }
    .rate { width: 92px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="cell lock" id="lock" title="Page non chiffrée">
    <svg viewBox="0 0 11 14" aria-hidden="true"><path class="shackle" id="shackle" d="M2.5 7 V4.5 a3 3 0 0 1 6 0 V5"/><rect class="body" x="1" y="7" width="9" height="6.5" rx="1"/></svg>
  </div>
  <div class="cell meter" id="meter" title="Avancement du chargement"><div class="fill" id="fill"></div></div>
  <div class="cell text"><span class="text" id="text">Hors ligne</span></div>
  <div class="cell rate" id="rate" title="Débit reçu par le navigateur"></div>
  <script src="nav-progres.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    suivreChargement((e) => {
      $("text").textContent = e.texte;
      $("meter").classList.toggle("vague", e.vague && e.occupe);
      $("fill").style.width = e.vague ? "" : `${Math.round((e.part || 0) * 100)}%`;
      $("rate").textContent = e.debit >= 50 ? `${navKo(Math.round(e.debit))}/s` : "";
      $("lock").classList.toggle("sure", e.https);
      $("shackle").setAttribute("d", e.https ? "M2.5 7 V4.5 a3 3 0 0 1 6 0 V7" : "M2.5 7 V4.5 a3 3 0 0 1 6 0 V5");
      $("lock").title = e.https ? "Page chiffrée (HTTPS) : le modem ne voit que des octets" : "Page non chiffrée";
    });
  </script>
</body>
</html>
