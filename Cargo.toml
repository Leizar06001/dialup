[workspace]
resolver = "2"
members = ["crates/v34-core", "crates/v34-net", "crates/v34-cli", "crates/v34-server", "app/src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
v34-core = { path = "crates/v34-core" }
v34-net = { path = "crates/v34-net" }

[profile.dev]
opt-level = 2   # le DSP temps réel a besoin d'optimisations même en dev
